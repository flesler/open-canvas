name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: lock root version matches package.json
        run: node -e "const p=require('./package.json');const r=require('./package-lock.json').packages[''].version;if(p.version!==r)throw new Error('package.json '+p.version+' vs lock '+r)"
      - run: npx playwright install chromium
      - run: npm run build:cli
      - run: npm run lint:full
      - run: npm test
      - run: npm run test:pack
      - run: node dist/cli.js verify example/showcase.canvas.tsx
      - run: npm run test:smoke
