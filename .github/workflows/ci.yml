name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/checkout@v4
        with:
          repository: flesler/cursor-canvas-web
          path: cursor-canvas-web
          ref: v1.1.0
      - run: npm install ./cursor-canvas-web && npm install
      - name: lock root version matches package.json
        run: node -e "const p=require('./package.json');const r=require('./package-lock.json').packages[''].version;if(p.version!==r)throw new Error('package.json '+p.version+' vs lock '+r)"
      - run: npx playwright install chromium
      - run: npm run build:cli
      - run: npm run lint:full
      - run: npm test
      - run: npm run test:pack
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: npm run test:contract
      - run: npm run test:smoke
